name: Get Citation Data

on: 
 workflow_dispatch:
 schedule:
  - cron:  '0 8 * * *'
 push:
  branches:
   - main
  paths:
   - 'google_scholar_crawler/**'
   - '.github/workflows/google_scholar_crawler.yaml'
   - '_data/scholar_publication_overrides.json'

permissions:
 contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        cp ./results/google_scholar_publications.json ../_data/google_scholar_publications.json
        cd ..
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add _data/google_scholar_publications.json
        git diff --cached --quiet || git commit -m "Update Google Scholar publications data"
        git push origin HEAD:main
        cd ./google_scholar_crawler
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
